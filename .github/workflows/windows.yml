name: Windows wallet build

on:
  pull_request:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
          architecture: x64
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match version.txt' }
      - name: Regression tests, build, offline executable checks and checksums
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wart-dapp-windows-x64
          path: |
            dist/*/wart-dapp-*-windows-x64.zip
            dist/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
